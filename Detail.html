<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Aset</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen <?!= bgImageUrl ? 'has-custom-bg' : '' ?>" style="<?!= bgImageUrl ? 'background-image: url(\'' + bgImageUrl + '\'); background-size: cover; background-position: center; background-attachment: fixed; background-repeat: no-repeat;' : '' ?>">

  <div id="app" class="container mx-auto max-w-2xl p-4 sm:p-6 lg:p-8">
    
    <!-- Loading State -->
    <div id="loader" class="text-center py-20">
      <i class="fas fa-spinner fa-spin text-4xl text-indigo-500"></i>
      <p class="mt-4 text-gray-600">Memuat detail aset...</p>
    </div>

    <!-- Error State -->
    <div id="error-message" class="hidden text-center py-20 bg-red-50 border border-red-200 rounded-lg">
      <i class="fas fa-exclamation-triangle text-4xl text-red-500"></i>
      <h2 class="mt-4 text-2xl font-bold text-red-700">Aset Tidak Ditemukan</h2>
      <p class="mt-2 text-gray-600">Maaf, kami tidak dapat menemukan aset dengan ID yang Anda berikan.</p>
    </div>

    <!-- Content State -->
    <div id="asset-content" class="hidden bg-white p-6 sm:p-8 rounded-2xl shadow-lg">
      <div class="flex items-center pb-4 border-b mb-6">
        <div id="asset-icon" class="w-12 h-12 rounded-lg flex items-center justify-center text-white text-2xl mr-4">
          <!-- Icon will be injected here -->
        </div>
        <div>
          <h1 id="asset-type-title" class="text-2xl sm:text-3xl font-bold text-gray-800"></h1>
          <p class="text-gray-500">Detail Lengkap Aset</p>
        </div>
      </div>
      
      <div id="asset-details-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-4 text-sm">
        <!-- Asset details will be injected here -->
      </div>
    </div>

    <footer class="text-center mt-8 text-white font-medium drop-shadow-md text-sm">
      Aplikasi Inventaris &copy; 2024
    </footer>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loader = document.getElementById('loader');
      const errorMessage = document.getElementById('error-message');
      const assetContent = document.getElementById('asset-content');
      const assetIcon = document.getElementById('asset-icon');
      const assetTypeTitle = document.getElementById('asset-type-title');
      const assetDetailsGrid = document.getElementById('asset-details-grid');

      // Ambil ID aset dari URL
      const assetId = "<?= assetId ?>";

      const iconMap = {
        'Laptop': { icon: 'fa-laptop', color: 'bg-green-500' },
        'Headset': { icon: 'fa-headset', color: 'bg-blue-500' },
        'Speaker': { icon: 'fa-volume-up', color: 'bg-purple-500' },
        'PC': { icon: 'fa-desktop', color: 'bg-red-500' }
      };

      const renderDetails = (data) => {
        if (!data || !data.details) {
          loader.classList.add('hidden');
          errorMessage.classList.remove('hidden');
          return;
        }

        const { assetType, details } = data;

        // Set judul dan ikon
        assetTypeTitle.textContent = assetType;
        const iconInfo = iconMap[assetType] || { icon: 'fa-box', color: 'bg-gray-500' };
        assetIcon.innerHTML = `<i class="fas ${iconInfo.icon}"></i>`;
        assetIcon.className += ` ${iconInfo.color}`;

        // Render semua detail
        let detailsHtml = '';
        for (const key in details) {
          if (details.hasOwnProperty(key) && details[key]) { // Hanya tampilkan jika ada nilainya
            detailsHtml += `
              <div class="py-2">
                <p class="font-semibold text-gray-600">${key}</p>
                <p class="text-gray-800">${details[key]}</p>
              </div>
            `;
          }
        }
        assetDetailsGrid.innerHTML = detailsHtml;

        // Tampilkan konten
        loader.classList.add('hidden');
        assetContent.classList.remove('hidden');
      };
      
      // Panggil fungsi di Code.gs untuk mengambil data
      if (assetId) {
        google.script.run
          .withSuccessHandler(renderDetails)
          .withFailureHandler(() => {
            loader.classList.add('hidden');
            errorMessage.classList.remove('hidden');
          })
          .getAssetDetailsById(assetId);
      } else {
        loader.classList.add('hidden');
        errorMessage.classList.remove('hidden');
      }
    });
  </script>

</body>
</html>
