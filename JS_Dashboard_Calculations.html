<script>
    // --- DASHBOARD CALCULATIONS ---

    function calculatePcStats(data) {
        const stats = {
            totalPC: data.length,
            countByFloor: {},
            osByFloor: {},
            typeByFloor: {},
            statusByFloor: {}
        };

        data.forEach(pc => {
            const floor = pc['Lantai'] || 'N/A';
            const os = pc['Operating System'] || 'N/A';
            const type = pc['Type PC'] || 'N/A';
            const rawStatus = (pc['Status'] || '').toUpperCase();

            let status = 'TERSEDIA'; // Default (Uppercase)
            if (rawStatus.includes('PAKAI') || rawStatus.includes('PINJAM')) {
                status = 'DIPAKAI';
            } else if (rawStatus.includes('RUSAK') || rawStatus.includes('MASALAH') || rawStatus.includes('MATI')) {
                status = 'RUSAK';
            } else if (rawStatus.includes('SEDIA') || rawStatus.includes('STOK') || rawStatus.includes('KEMBALI')) {
                status = 'TERSEDIA';
            } else if (rawStatus === '') {
                status = 'N/A';
            } else {
                status = rawStatus; // Use raw
            }

            stats.countByFloor[floor] = (stats.countByFloor[floor] || 0) + 1;
            if (!stats.osByFloor[floor]) stats.osByFloor[floor] = {};
            stats.osByFloor[floor][os] = (stats.osByFloor[floor][os] || 0) + 1;
            if (!stats.typeByFloor[floor]) stats.typeByFloor[floor] = {};
            stats.typeByFloor[floor][type] = (stats.typeByFloor[floor][type] || 0) + 1;
            if (!stats.statusByFloor[floor]) stats.statusByFloor[floor] = {};
            stats.statusByFloor[floor][status] = (stats.statusByFloor[floor][status] || 0) + 1;
        });
        return stats;
    }

    function calculateTabletStats(data) {
        const stats = {
            total: 0,
            dipakai: 0,
            tersedia: 0,
            rusak: 0,
            byBrand: {},
            latest5: []
        };
        if (!data) return stats;

        stats.total = data.length;
        data.forEach(item => {
            const status = String(getRobustValue(item, ['Status']) || 'N/A').trim();
            const brand = getRobustValue(item, ['Merek', 'Merk', 'Brand']) || 'Lainnya';

            if (status.toUpperCase() === 'DIPAKAI') {
                stats.dipakai++;
            } else if (status.toUpperCase() === 'TERSEDIA') {
                stats.tersedia++;
            } else if (status.toUpperCase() === 'RUSAK') {
                stats.rusak++;
            }

            if (brand !== 'Lainnya') {
                stats.byBrand[brand] = (stats.byBrand[brand] || 0) + 1;
            }
        });

        stats.latest5 = data
            .map(item => {
                const tglPinjam = getRobustValue(item, ['Tgl Peminjaman', 'Tanggal Peminjaman', 'Tgl Pinjam', 'Loan Date']);
                if (!tglPinjam) return null;
                const startDate = new Date(tglPinjam);
                if (isNaN(startDate.getTime())) return null;

                const status = getRobustValue(item, ['Status']) || 'N/A';
                const isReturned = status.toUpperCase() === 'TERSEDIA';
                const tglKembali = getRobustValue(item, ['Tgl Pengembalian', 'Tanggal Pengembalian', 'Tgl Kembali', 'Return Date']);
                
                const endDate = isReturned && tglKembali ? new Date(tglKembali) : new Date();
                const diffMs = endDate - startDate;
                const diffDays = Math.floor(diffMs / 86400000);
                const diffHrs = Math.floor((diffMs % 86400000) / 3600000);
                const diffMins = Math.round((diffMs % 3600000) / 60000);
                let duration = '';
                if (diffDays > 0) duration += `${diffDays} Hari, `;
                duration += `${String(diffHrs).padStart(2, '0')}:${String(diffMins).padStart(2, '0')}`;

                return {
                    name: getRobustValue(item, ['Nama', 'Name', 'Pengguna', 'Peminjam', 'Nama Pengguna']) || 'Unknown',
                    status: status,
                    duration: duration,
                    loanDate: startDate
                };
            })
            .filter(item => item !== null)
            .sort((a, b) => b.loanDate - a.loanDate)
            .slice(0, 5);

        return stats;
    }

    function calculateRamStats(data) {
        const stats = {
            totalRAM: data.length,
            countByStatus: {},
            countByType: {},
            countByJenis: {},
            countBySize: {}
        };

        data.forEach(ram => {
            const status = ram['Status'] || 'N/A';
            const type = ram['Type Ram'] || 'N/A';
            const jenis = ram['Jenis Ram'] || 'N/A';
            const size = ram['Size'] ? `${ram['Size']} GB` : 'N/A';

            stats.countByStatus[status] = (stats.countByStatus[status] || 0) + 1;
            stats.countByType[type] = (stats.countByType[type] || 0) + 1;
            stats.countByJenis[jenis] = (stats.countByJenis[jenis] || 0) + 1;
            stats.countBySize[size] = (stats.countBySize[size] || 0) + 1;
        });
        return stats;
    }

    function calculateLaptopStats(data) {
        const stats = {
            total: 0,
            dipakai: 0,
            tersedia: 0,
            rusak: 0,
            byBrand: {},
            latest5: []
        };
        if (!data) return stats;

        stats.total = data.length;
        data.forEach(item => {
            const status = String(getRobustValue(item, ['Status']) || 'N/A').trim();
            const brand = getRobustValue(item, ['Merek', 'Merk', 'Brand']) || 'Lainnya';

            if (status.toUpperCase() === 'DIPAKAI') {
                stats.dipakai++;
            } else if (status.toUpperCase() === 'TERSEDIA') {
                stats.tersedia++;
            } else if (status.toUpperCase() === 'RUSAK') {
                stats.rusak++;
            }

            if (brand !== 'Lainnya') {
                stats.byBrand[brand] = (stats.byBrand[brand] || 0) + 1;
            }
        });

        stats.latest5 = data
            .map(item => {
                const tglPinjam = getRobustValue(item, ['Tgl Peminjaman', 'Tanggal Peminjaman', 'Tgl Pinjam', 'Loan Date']);
                if (!tglPinjam) return null;
                const startDate = new Date(tglPinjam);
                if (isNaN(startDate.getTime())) return null;

                const status = getRobustValue(item, ['Status']) || 'N/A';
                const isReturned = status.toUpperCase() === 'TERSEDIA';
                const tglKembali = getRobustValue(item, ['Tgl Pengembalian', 'Tanggal Pengembalian', 'Tgl Kembali', 'Return Date']);
                
                const endDate = isReturned && tglKembali ? new Date(tglKembali) : new Date();
                const diffMs = endDate - startDate;
                const diffDays = Math.floor(diffMs / 86400000);
                const diffHrs = Math.floor((diffMs % 86400000) / 3600000);

                let duration = '';
                if (diffDays > 0) duration += `${diffDays} Hari, `;
                duration += `${String(diffHrs).padStart(2, '0')}:${String(diffMins).padStart(2, '0')}`;

                return {
                    name: getRobustValue(item, ['Nama', 'Name', 'Pengguna', 'Peminjam', 'Nama Pengguna']) || 'Unknown',
                    status: status,
                    duration: duration,
                    loanDate: startDate
                };
            })
            .filter(item => item !== null)
            .sort((a, b) => b.loanDate - a.loanDate)
            .slice(0, 5);

        return stats;
    }

    function getRobustValue(item, possibleKeys) {
        if (!item) return null;
        // Cari key yang cocok secara case-insensitive
        const itemKeys = Object.keys(item);
        for (const targetKey of possibleKeys) {
            const foundKey = itemKeys.find(k => k.toLowerCase().trim() === targetKey.toLowerCase());
            if (foundKey && (item[foundKey] !== undefined && item[foundKey] !== null)) {
                return item[foundKey];
            }
        }
        return null;
    }

    function calculateStandardStats(assetType, data) {
        // Jika data tidak dikirim, ambil dari global (fallback)
        const items = data || allData[assetType] || [];
        
        const stats = {
            total: items.length,
            borrowed: items.filter(d => { 
                const s = String(getRobustValue(d, ['Status']) || '').toUpperCase(); 
                return s.includes('PAKAI') || s.includes('PINJAM') || s.includes('SPEAKER DIPAKAI'); 
            }).length,
            returned: items.filter(d => { 
                const s = String(getRobustValue(d, ['Status']) || '').toUpperCase(); 
                return s.includes('SEDIA') || s.includes('KEMBALI') || s.includes('SPEAKER TERSEDIA'); 
            }).length,
            broken: items.filter(d => { 
                const s = String(getRobustValue(d, ['Status']) || '').toUpperCase(); 
                return s.includes('RUSAK') || s.includes('MATI'); 
            }).length,
            byBrand: {},
            top5Durations: []
        };

        items.forEach(item => {
            const brand = getRobustValue(item, ['Merek', 'Merk', 'Brand', 'Merek Laptop', 'Type']) || 'Lainnya';
            stats.byBrand[brand] = (stats.byBrand[brand] || 0) + 1;
        });

        const allItemsWithDuration = items.map(item => {
            const tglPinjam = getRobustValue(item, ['Tgl Peminjaman', 'Tanggal Peminjaman', 'Tgl Pinjam', 'Loan Date']);
            if (!tglPinjam) return null;
            
            const startDate = new Date(tglPinjam);
            if (isNaN(startDate.getTime())) return null;

            const s = String(getRobustValue(item, ['Status']) || '').toUpperCase();
            const isReturned = s.includes('SEDIA') || s.includes('KEMBALI');
            const tglKembali = getRobustValue(item, ['Tgl Pengembalian', 'Tanggal Pengembalian', 'Tgl Kembali', 'Return Date']);
            
            const endDate = isReturned && tglKembali ? new Date(tglKembali) : new Date();
            const diffMs = endDate - startDate;

            const diffDays = Math.floor(diffMs / 86400000);
            const diffHrs = Math.floor((diffMs % 86400000) / 3600000);
            const diffMins = Math.floor((diffMs % 3600000) / 60000);
            let dayString = diffDays > 0 ? `${diffDays} Hari, ` : '';
            const timeString = [String(diffHrs).padStart(2, '0'), String(diffMins).padStart(2, '0')].join(':');

            return {
                name: getRobustValue(item, ['Nama', 'Name', 'Pengguna', 'Peminjam', 'Nama Pengguna']) || 'Unknown',
                status: `(${getRobustValue(item, ['Status']) || 'Unknown'})`,
                duration: dayString + timeString,
                durationMs: diffMs,
                loanDate: startDate
            };
        }).filter(item => item !== null);

        stats.top5Durations = allItemsWithDuration
            .sort((a, b) => b.loanDate - a.loanDate)
            .slice(0, 5);

        return stats;
    }

    function calculateNewHeadsetStats(data) {
        const stats = {
            total: 0,
            dipakai: 0,
            tersedia: 0,
            rusak: 0,
            byBrand: {},
            byLayanan: {}
        };
        if (!data) return stats;

        stats.total = data.length;
        data.forEach(item => {
            const status = String(getRobustValue(item, ['Status']) || 'N/A').trim();
            const brand = getRobustValue(item, ['Merek', 'Merk', 'Brand']) || 'N/A';
            const layanan = getRobustValue(item, ['Layanan']) || 'N/A';
            const kondisi = getRobustValue(item, ['Kondisi']) || 'N/A';

            if (status.toUpperCase() === 'DIPAKAI') {
                stats.dipakai++;
            } else if (status.toUpperCase() === 'RUSAK') {
                stats.rusak++;
            } else if (status.toUpperCase() === 'TERSEDIA') {
                stats.tersedia++;
            } else if (status === 'Dikembalikan') {
                if (kondisi === 'Rusak') {
                    stats.rusak++;
                } else {
                    stats.tersedia++;
                }
            }

            if (brand !== 'N/A' && brand !== 'Lainnya') {
                stats.byBrand[brand] = (stats.byBrand[brand] || 0) + 1;
            }
            if (layanan !== 'N/A') {
                stats.byLayanan[layanan] = (stats.byLayanan[layanan] || 0) + 1;
            }
        });
        return stats;
    }
</script>
