<script>

    const generateDynamicTableHtml = (dataRows, fieldsConfig, state) => {
        let groupedHeaders = [];
        const processedGroups = new Set();
        const allKeys = dataRows.length > 0 ? Object.keys(dataRows[0]) : [];
        const systemEnd = ["Petugas", "Status", "Tgl Peminjaman", "Tgl Pengembalian", "Timestamp", "Diubah Oleh", "RowIndex", "SheetName", "ID", "Aksi"];

        if (fieldsConfig && fieldsConfig.length > 0) {
            fieldsConfig.forEach(f => {
                if (f.hiddenInDashboard || systemEnd.includes(f.name)) return;
                if (f.groupName) {
                    const gName = f.groupName.trim();
                    if (!processedGroups.has(gName)) {
                        const groupFields = fieldsConfig.filter(cf => cf.groupName && cf.groupName.trim() === gName && !cf.hiddenInDashboard).map(cf => cf.name);
                        groupedHeaders.push({ type: 'group', name: gName, fields: groupFields });
                        processedGroups.add(gName);
                    }
                } else {
                    groupedHeaders.push({ type: 'single', name: f.name });
                }
            });
        } else {
            allKeys.forEach(k => {
                if (!systemEnd.includes(k)) {
                    groupedHeaders.push({ type: 'single', name: k });
                }
            });
        }
        
        if (allKeys.includes('Petugas')) {
            groupedHeaders.push({ type: 'single', name: 'Petugas' });
        }
        groupedHeaders.push({ type: 'single', name: 'Status' });
        groupedHeaders.push({ type: 'single', name: 'Tgl Peminjaman' });
        groupedHeaders.push({ type: 'single', name: 'Tgl Pengembalian' });

        groupedHeaders.push({ type: 'action', name: 'Aksi' });

        const theadHtml = `<thead class="sticky top-0 z-20 text-xs text-gray-700 dark:text-gray-300 uppercase bg-gray-100 dark:bg-gray-700 hidden md:table-header-group">
            <tr>${groupedHeaders.map(col => {
                const h = col.name;
                if (col.type === 'action') {
                    return `<th scope="col" class="px-4 py-3 align-top"><div>${h}</div></th>`;
                }
                if (h.toUpperCase() === 'STATUS') {
                    return `<th scope="col" class="px-4 py-3 align-top h-full align-middle">
                <div class="flex flex-col justify-between h-full min-h-[4rem]">
                    <div>${h}</div>
                    <select class="form-select text-xs !p-1.5 mt-2 w-full font-normal" data-control="status-filter">
                            ${typeof getStatusFilterOptionsHtml === 'function' ? getStatusFilterOptionsHtml(state.assetType || '', state.statusFilter) : `
                            <option value="all" ${state.statusFilter === 'all' ? 'selected' : ''}>SEMUA STATUS</option>
                            <option value="DIPAKAI" ${state.statusFilter === 'DIPAKAI' ? 'selected' : ''}>DIPAKAI</option>
                            <option value="TERSEDIA" ${state.statusFilter === 'TERSEDIA' ? 'selected' : ''}>TERSEDIA</option>
                            <option value="RUSAK" ${state.statusFilter === 'RUSAK' ? 'selected' : ''}>RUSAK</option>
                            `}
                        </select>
                </div>
            </th>
                    </th>`;
                }
                if (h.toUpperCase() === 'KONDISI') {
                    return `<th scope="col" class="px-4 py-3 align-top h-full align-middle">
                <div class="flex flex-col justify-between h-full min-h-[4rem]">
                    <div>${h}</div>
                    <select class="form-select text-xs !p-1.5 mt-2 w-full font-normal" data-filter="kondisi">
                            <option value="all" ${state.kondisiFilter === 'all' ? 'selected' : ''}>SEMUA KONDISI</option>
                            <option value="Baru" ${state.kondisiFilter === 'Baru' ? 'selected' : ''}>BARU</option>
                            <option value="Bisa Dipakai" ${state.kondisiFilter === 'Bisa Dipakai' ? 'selected' : ''}>BISA DIPAKAI</option>
                            <option value="Rusak" ${state.kondisiFilter === 'Rusak' ? 'selected' : ''}>RUSAK</option>
                        </select>
                </div>
            </th>
                    </th>`;
                }
                if (['TGL PEMINJAMAN', 'TGL PENGEMBALIAN'].includes(h.toUpperCase())) {
                    return `<th scope="col" class="px-4 py-3 align-top h-full align-middle text-center">
                <div class="flex flex-col justify-between h-full min-h-[4rem] items-center">
                    <div>${h}</div>
                    <div class="relative w-full mt-2">
                        <input type="text" class="form-input text-xs !py-1.5 !pl-1.5 !pr-7 w-full font-normal" data-col-filter="${h}" placeholder="Cari..." value="${state.columnFilters?.[h] || ''}">
                        ${state.columnFilters?.[h] ? `<i class="fas fa-times absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 cursor-pointer hover:text-gray-600" onclick="this.previousElementSibling.value=''; this.previousElementSibling.dispatchEvent(new Event('input', {bubbles:true}))"></i>` : ''}
                    </div>
                </div>
            </th>`;
                }
                return `<th scope="col" class="px-4 py-3 align-top h-full align-middle">
                <div class="flex flex-col justify-between h-full min-h-[4rem]">
                    <div>${h}</div>
                    <div class="relative w-full mt-2">
                        <input type="text" class="form-input text-xs !py-1.5 !pl-1.5 !pr-7 w-full font-normal" data-col-filter="${h}" placeholder="Cari..." value="${state.columnFilters?.[h] || ''}">
                        ${state.columnFilters?.[h] ? `<i class="fas fa-times absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 cursor-pointer hover:text-gray-600" onclick="this.previousElementSibling.value=''; this.previousElementSibling.dispatchEvent(new Event('input', {bubbles:true}))"></i>` : ''}
                    </div>
                
                </div>
            `;
            }).join('')}</tr>
        </thead>`;

        const tbodyHtml = `<tbody>${dataRows.map(row => `
            <tr class="block md:table-row bg-white border md:border-gray-200 dark:border-gray-700 md:border-b dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-600 mb-4 md:mb-0 rounded-lg shadow-md md:shadow-none">
                ${groupedHeaders.map(col => {
                    const h = col.name;
                    if (col.type === 'action') {
                        return `<td class="p-3 block md:table-cell md:px-4 md:py-4 border-b border-gray-200 dark:border-gray-700 md:border-none text-left">
                            <div class="md:hidden font-bold uppercase text-gray-700 dark:text-gray-300 mb-2">AKSI</div>
                            <div class="flex items-center justify-start ml-3 md:ml-0 space-x-2">
                                <button data-action="view" data-id="${row['ID']}" class="text-blue-500 hover:text-blue-700"><i class="fas fa-eye"></i></button>
                                <button data-action="edit" data-id="${row['ID']}" class="text-yellow-500 hover:text-yellow-700"><i class="fas fa-edit"></i></button>
                                <button data-action="delete" data-id="${row['ID']}" class="text-red-500 hover:text-red-700"><i class="fas fa-trash"></i></button>
                            </div>
                        </td>`;
                    } else if (col.type === 'group') {
                        return `<td class="p-3 block md:table-cell md:px-4 md:py-4 border-b border-gray-200 dark:border-gray-700 md:border-none text-left">
                            <div class="md:hidden font-bold uppercase text-gray-700 dark:text-gray-300 mb-1">${h}</div>
                            <div class="flex flex-col gap-1 text-xs">
                                ${col.fields.map(f => `
                                <div class="flex flex-row md:block items-start ml-3 md:ml-0">
                                    <span class="w-[40%] md:w-auto text-gray-600 md:text-gray-900 md:font-bold flex-shrink-0">${f}</span>
                                    <span class="w-[60%] md:w-auto md:inline"><span class="md:hidden mr-1">:</span>${row[f] || '-'}</span>
                                </div>`).join('')}
                            </div>
                        </td>`;
                    } else {
                        if (col.name.toUpperCase() === 'STATUS') {
                            return `<td class="p-3 block md:table-cell md:px-4 md:py-4 border-b border-gray-200 dark:border-gray-700 md:border-none text-left">
                                <div class="md:hidden font-bold uppercase text-gray-700 dark:text-gray-300 mb-1">${h}</div>
                                <div class="ml-3 md:ml-0">${row[col.name] || ''}</div>
                            </td>`;
                        }
                        if (col.name.toUpperCase() === 'TGL PEMINJAMAN') {
                            return `<td class="p-3 block md:table-cell md:px-4 md:py-4 border-b border-gray-200 dark:border-gray-700 md:border-none text-left">
                                <div class="md:hidden font-bold uppercase text-gray-700 dark:text-gray-300 mb-1">${h}</div>
                                <div class="flex items-center justify-start ml-3 md:ml-0 gap-2">
                                    <span>${row[col.name] || ''}</span>
                                    <button data-action="edit-date" data-field="loan" data-id="${row['ID']}" class="text-blue-500 hover:text-blue-700 p-1"><i class="fas fa-calendar-alt"></i></button>
                                </div>
                            </td>`;
                        }
                        if (col.name.toUpperCase() === 'TGL PENGEMBALIAN') {
                            return `<td class="p-3 block md:table-cell md:px-4 md:py-4 border-b border-gray-200 dark:border-gray-700 md:border-none text-left">
                                <div class="md:hidden font-bold uppercase text-gray-700 dark:text-gray-300 mb-1">${h}</div>
                                <div class="flex items-center justify-start ml-3 md:ml-0 gap-2">
                                    <span>${row[col.name] || ''}</span>
                                    <button data-action="edit-date" data-field="return" data-id="${row['ID']}" class="text-blue-500 hover:text-blue-700 p-1"><i class="fas fa-calendar-alt"></i></button>
                                </div>
                            </td>`;
                        }
                        return `<td class="p-3 block md:table-cell md:px-4 md:py-4 border-b border-gray-200 dark:border-gray-700 md:border-none text-left">
                            <div class="md:hidden font-bold uppercase text-gray-700 dark:text-gray-300 mb-1">${h}</div>
                            <div class="ml-3 md:ml-0 inline-block break-words">${row[col.name] || ''}</div>
                        </td>`;
                    }
                }).join('')}
            </tr>
        `).join('')}</tbody>`;

        return `<table class="w-full text-sm text-left text-gray-500 dark:text-gray-400">${theadHtml}${tbodyHtml}</table>`;
    };

    // --- ASSET SPECIFIC RENDERERS ---

    // --- PC ---
    const renderPcCharts = (stats) => {
        const doughnutOptions = getDoughnutOptions();

        // Consistent color maps
        const osColorMap = {
            'Windows 11 Pro': '#60a5fa',         // Blue
            'Windows 10 Pro': '#34d399',         // Teal/Green
            'Windows 7 Pro': '#fb923c',          // Orange
            'Windows Server 2012 R2': '#f87171', // Red
            'Windows XP': '#a78bfa'              // Purple
        };
        const floorColorMap = {
            'Lantai 10': '#93c5fd',
            'Lantai 11': '#34d399',
            'Lantai 9': '#fb923c',
            'Semarang': '#c4b5fd'
        };
        const defaultColors = ['#93c5fd', '#34d399', '#c4b5fd', '#a78bfa', '#fca5a5', '#fb923c', '#f87171'];

        const generateLegend = (chartId, chart) => {
            const legendContainer = document.getElementById(chartId + '-legend');
            if (!legendContainer) return;

            const legendItems = chart.data.labels.map((label, index) => {
                const color = chart.data.datasets[0].backgroundColor[index];
                const value = chart.data.datasets[0].data[index];
                if (value === 0 || !label) return '';

                if (chartId === 'totalPcChart' && stats.statusByFloor && stats.statusByFloor[label]) {
                    const s = stats.statusByFloor[label];
                    const getValue = (key) => {
                        const k = Object.keys(s).find(k => k.toUpperCase() === key.toUpperCase());
                        const val = k ? s[k] : 0;
                        return (val === 0 || !val) ? '-' : val;
                    };

                    const dipakai = getValue('DIPAKAI');
                    const tersedia = getValue('TERSEDIA');
                    const rusak = getValue('RUSAK');

                    return `
                        <div class="flex items-start md:items-center mb-2 last:mb-0 pb-1.5 border-b border-gray-100 dark:border-gray-700/50 last:border-0 hover:bg-gray-50 dark:hover:bg-gray-700/30 transition-colors">
                            <span class="w-2 h-2 rounded-sm mr-2 mt-1 md:mt-0 flex-shrink-0" style="background-color: ${color};"></span>
                            <div class="flex flex-col md:flex-row md:items-center text-[9px] md:text-[8.5px] text-gray-500 dark:text-gray-400 flex-grow min-w-0">
                                <span class="font-bold text-gray-700 dark:text-gray-200 w-full md:w-24 truncate mb-0.5 md:mb-0">${label}</span>
                                <div class="grid grid-cols-3 gap-1 md:gap-2 w-full md:w-auto flex-grow md:ml-2 items-center">
                                    <div class="whitespace-nowrap">Dipakai: <strong class="text-gray-900 dark:text-white">${dipakai}</strong></div>
                                    <div class="whitespace-nowrap flex items-center">
                                        <span class="hidden md:inline opacity-20 text-gray-400 mr-2 md:mr-3">|</span> 
                                        <span>Tersedia: <strong class="text-gray-900 dark:text-white">${tersedia}</strong></span>
                                    </div>
                                    <div class="whitespace-nowrap flex items-center">
                                        <span class="hidden md:inline opacity-20 text-gray-400 mr-2 md:mr-3">|</span> 
                                        <span>Rusak: <strong class="text-gray-900 dark:text-white">${rusak}</strong></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }

                return `
                  <div class="flex items-center mb-0.5 last:mb-0">
                      <span class="w-2 h-2 rounded-sm mr-2 flex-shrink-0" style="background-color: ${color};"></span>
                      <span class="text-[8px] text-gray-600 dark:text-gray-400 truncate">${label}: <strong class="text-gray-800 dark:text-gray-200">${value}</strong></span>
                  </div>
                `;
            }).join('');

            legendContainer.innerHTML = legendItems;
        };

        const allFloors = Object.keys(stats.countByFloor || {}).sort();

        // 1. Total PC by Floor Chart
        const totalPcCtx = document.getElementById('totalPcChart');
        if (totalPcCtx && stats.countByFloor) {
            if (charts.totalPc) charts.totalPc.destroy();
            const floorData = stats.countByFloor || {};
            const sortedLabels = allFloors;
            const sortedData = sortedLabels.map(label => floorData[label]);
            const sortedColors = sortedLabels.map(label => floorColorMap[label] || defaultColors[0]);
            charts.totalPc = new Chart(totalPcCtx, {
                type: 'doughnut',
                data: {
                    labels: sortedLabels,
                    datasets: [{
                        data: sortedData,
                        backgroundColor: sortedColors,
                        borderColor: document.documentElement.classList.contains('dark') ? '#1f2937' : '#fff'
                    }]
                },
                options: doughnutOptions
            });
            generateLegend('totalPcChart', charts.totalPc);
        }

        // 2. OS by Floor Charts (Dynamic Loop)
        const osSortOrder = ['Windows 11 Pro', 'Windows 10 Pro', 'Windows 7 Pro', 'Windows XP', 'Windows Server 2012 R2'];
        allFloors.forEach(floor => {
            const chartId = `osChart${floor.replace(/\s+/g, '')}`;
            const ctx = document.getElementById(chartId);
            if (ctx && stats.osByFloor && stats.osByFloor[floor]) {
                if (charts[chartId]) charts[chartId].destroy();
                const osData = stats.osByFloor[floor] || {};
                const sortedOsLabels = osSortOrder.filter(os => osData[os] >= 0); // Keep 0 if mentioned in order, or filter > 0? Image shows only > 0.
                const filteredOsLabels = sortedOsLabels.filter(os => osData[os] > 0);
                const sortedOsData = filteredOsLabels.map(label => osData[label]);
                const sortedOsColors = filteredOsLabels.map(label => osColorMap[label] || defaultColors[0]);

                charts[chartId] = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: filteredOsLabels,
                        datasets: [{
                            data: sortedOsData,
                            backgroundColor: sortedOsColors,
                            borderColor: document.documentElement.classList.contains('dark') ? '#1f2937' : '#fff'
                        }]
                    },
                    options: doughnutOptions
                });
                generateLegend(chartId, charts[chartId]);
            } else if (ctx) {
                const context = ctx.getContext('2d');
                context.clearRect(0, 0, ctx.width, ctx.height);
                if (charts[chartId]) charts[chartId].destroy();
            }
        });
    };

    const generatePcDashboardHtml = (data, state, stats, fieldsConfig) => {
        const paginatedData = data.slice((state.currentPage - 1) * state.rowsPerPage, state.currentPage * state.rowsPerPage);
        const totalPages = Math.ceil(data.length / state.rowsPerPage);
        const osOrder = ['Windows 11 Pro', 'Windows 10 Pro', 'Windows 7 Pro', 'Windows Server 2012 R2', 'Windows XP'];
        const merekOrder = ['ACER', 'AXIOO', 'HP', 'LENOVO'];
        const colorMap = {
            'Windows 11 Pro': 'text-blue-500',
            'ACER': 'text-blue-600',
            'Windows 10 Pro': 'text-emerald-500',
            'AXIOO': 'text-emerald-500',
            'Windows 7 Pro': 'text-orange-500',
            'HP': 'text-orange-600',
            'Windows Server 2012 R2': 'text-rose-500',
            'LENOVO': 'text-indigo-600',
            'Windows XP': 'text-indigo-400'
        };

        const allFloors = Object.keys(stats.countByFloor || {}).filter(f => f !== 'N/A').sort();

        const createStatColumnContent = (statObject, floor, order, colorMap) => {
            const floorStats = statObject ? statObject[floor] : {};
            return order.map(item => {
                const count = (floorStats && floorStats[item]) ? floorStats[item] : 0;
                const colorClass = colorMap[item] || 'text-gray-800';
                if (count > 0) return `<span class="block ${colorClass}">${item} : ${count}</span>`;
                else return `<span class="block text-gray-400">${item} : <span class="inline-flex items-center justify-center w-4 h-4 text-xs font-bold text-red-500 border border-red-500 rounded-full">0</span></span>`;
            }).join('');
        };

        const dynamicChartCards = allFloors.map(floor => `
        <div class="bg-white dark:bg-gray-800 p-2.5 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700">
            <div class="chart-container flex items-center min-h-[90px]">
                <div class="relative w-[40%] flex justify-center">
                    <div class="relative w-16 h-16">
                        <canvas id="osChart${floor.replace(/\s+/g, '')}"></canvas>
                        <div class="absolute inset-0 flex flex-col items-center justify-center text-center pointer-events-none">
                            <span class="font-medium text-gray-400 dark:text-gray-500 text-[8px] leading-tight">${floor}</span>
                            <span class="text-base font-bold text-gray-800 dark:text-white leading-none">${stats.countByFloor[floor] || 0}</span>
                        </div>
                    </div>
                </div>
                <div id="osChart${floor.replace(/\s+/g, '')}-legend" class="w-[60%] pl-3 flex flex-col justify-center space-y-0.5"></div>
            </div>
        </div>
      `).join('');

        const summaryCards = allFloors.map(floor => `
        <div class="bg-white dark:bg-gray-800 overflow-hidden rounded-xl shadow-md border border-gray-100 dark:border-gray-700">
            <div class="bg-gray-50 dark:bg-gray-700/50 px-4 py-2 border-b border-gray-100 dark:border-gray-700 text-center">
                <h4 class="font-bold text-sm text-gray-800 dark:text-white">${floor}</h4>
            </div>
            <div class="p-4 grid grid-cols-2 gap-4 text-[10px]">
                <div class="space-y-2">
                    <h5 class="font-bold text-gray-500 dark:text-gray-400 mb-1 border-b pb-1">OPERATING SYSTEM</h5>
                    <div class="space-y-1">
                        ${createStatColumnContent(stats.osByFloor, floor, osOrder, colorMap)}
                    </div>
                </div>
                <div class="space-y-2">
                    <h5 class="font-bold text-gray-500 dark:text-gray-400 mb-1 border-b pb-1">MEREK PC</h5>
                    <div class="space-y-1">
                        ${createStatColumnContent(stats.typeByFloor, floor, merekOrder, colorMap)}
                    </div>
                </div>
            </div>
        </div>
      `).join('');

        const hardcodedPcFields = ['ID', 'IP Address', 'Serial Number', 'RAM', 'Hostname', 'Type PC', 'Type Keyboard', 'Type Mouse', 'Serial Number Monitor', 'NIB Monitor', 'Nama', 'HQ', 'Extension', 'Layanan', 'Operating System', 'Lantai', 'Status', 'RowIndex', 'SheetName', 'Timestamp', 'Diubah Oleh', 'Aksi'];
        const allPcKeys = (state.originalData && state.originalData.length > 0) ? Object.keys(state.originalData[0]) : (data.length > 0 ? Object.keys(data[0]) : []);
        const dynamicPcFields = allPcKeys.filter(k => {
            const config = fieldsConfig && fieldsConfig.find(f => f.name.trim().toLowerCase() === k.trim().toLowerCase());
            if (config && config.hiddenInDashboard) return false;
            if (config && config.groupName && config.groupName.trim() !== '') return true;
            if (hardcodedPcFields.includes(k)) return false;
            return true;
        });
        if (fieldsConfig) {
            dynamicPcFields.sort((a, b) => {
                const indexA = fieldsConfig.findIndex(f => f.name.trim().toLowerCase() === a.trim().toLowerCase());
                const indexB = fieldsConfig.findIndex(f => f.name.trim().toLowerCase() === b.trim().toLowerCase());
                if (indexA === -1 && indexB === -1) return 0;
                if (indexA === -1) return 1;
                if (indexB === -1) return -1;
                return indexA - indexB;
            });
        }

        let groupedDynamicPcFields = [];
        let PcGroupMap = {};
        if (fieldsConfig) {
            fieldsConfig.forEach(f => {
                if (f.groupName) {
                    PcGroupMap[f.name] = f.groupName;
                }
            });
        }
        let processedPcGroups = new Set();
        dynamicPcFields.forEach(h => {
            let gName = PcGroupMap[h];
            if (gName) {
                if (!processedPcGroups.has(gName)) {
                    let fieldsInGroup = dynamicPcFields.filter(rh => PcGroupMap[rh] === gName);
                    groupedDynamicPcFields.push({ type: 'group', name: gName, fields: fieldsInGroup });
                    processedPcGroups.add(gName);
                }
            } else {
                groupedDynamicPcFields.push({ type: 'single', name: h });
            }
        });
        

        const isGrouped = (fieldName) => {
            if (!fieldsConfig) return false;
            const config = fieldsConfig.find(f => f.name.trim().toLowerCase() === fieldName.trim().toLowerCase());
            return config && config.groupName && config.groupName.trim() !== '';
        };

        const isHidden = (fieldName) => {
            if (!fieldsConfig) return false;
            const config = fieldsConfig.find(f => f.name.trim().toLowerCase() === fieldName.trim().toLowerCase());
            return (config && config.hiddenInDashboard) || isGrouped(fieldName);
        };
        const hasDetailPc = !isHidden('IP Address') || !isHidden('Serial Number') || !isHidden('RAM') || !isHidden('Hostname');
        const hasPerangkat = !isHidden('Type PC') || !isHidden('Type Keyboard') || !isHidden('Type Mouse');
        const hasDetailMonitor = !isHidden('Serial Number Monitor') || !isHidden('NIB Monitor');
        const hasDetailPengguna = !isHidden('Nama') || !isHidden('HQ') || !isHidden('Extension') || !isHidden('Layanan');

        const tableHeaders = `
        <thead class="sticky top-0 z-20 text-xs text-gray-700 dark:text-gray-300 uppercase bg-gray-100 dark:bg-gray-700 hidden md:table-header-group">
          <tr>
            
            ${!isHidden('Operating System') ? `<th scope="col" class="px-6 py-3 align-top h-full align-middle">
                <div class="flex flex-col justify-between h-full min-h-[4rem]">
                    <div>OPERATING SYSTEM</div>
                    <div class="relative w-full mt-2">
                        <input type="text" class="form-input text-xs !py-1.5 !pl-1.5 !pr-7 w-full font-normal" data-col-filter="Operating System" placeholder="Cari..." value="${state.columnFilters?.['Operating System'] || ''}">
                        ${state.columnFilters?.['Operating System'] ? `<i class="fas fa-times absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 cursor-pointer hover:text-gray-600" onclick="this.previousElementSibling.value=''; this.previousElementSibling.dispatchEvent(new Event('input', {bubbles:true}))"></i>` : ''}
                    </div>
        
                </div>
            ` : ''}
            ${!isHidden('Lantai') ? `<th scope="col" class="px-6 py-3 align-top h-full align-middle">
                <div class="flex flex-col justify-between h-full min-h-[4rem]">
                    <div>LANTAI</div>

        const tableBody = `

<span>Tampilkan</span><select class="form-select !p-2 !w-auto" data-control="rows-per-page">${[5, 10, 25, 50, 100].map(n => `<option ${state.rowsPerPage == n ? 'selected' : ''}>${n}</option>`).join('')}</select><span>data</span></div>

    };

    // --- RAM ---
    const renderRamCharts = (stats) => {
        const doughnutOptions = getDoughnutOptions();

        const isDark = document.documentElement.classList.contains('dark');

        const generateLegend = (chartId, chart) => {
            const legendContainer = document.getElementById(chartId + '-legend');
            if (!legendContainer) return;
            const legendItems = chart.data.labels.map((label, index) => {
                const color = chart.data.datasets[0].backgroundColor[index];
                const value = chart.data.datasets[0].data[index];
                if (value === 0) return '';
                return `<div class="flex items-center"><span class="w-3 h-3 rounded-sm mr-2" style="background-color: ${color};"></span><span>${label}: <strong>${value}</strong></span></div>`;
            }).join('');
            legendContainer.innerHTML = legendItems;
        };

        // 1. Total RAM Chart
        const totalRamCtx = document.getElementById('totalRamChart');
        if (totalRamCtx) {
            if (charts.totalRam) charts.totalRam.destroy();
            charts.totalRam = new Chart(totalRamCtx, { type: 'doughnut', data: { labels: ['Total RAM'], datasets: [{ data: [stats.totalRAM], backgroundColor: ['#34d399'], borderColor: isDark ? '#1f2937' : '#fff' }] }, options: doughnutOptions });
            generateLegend('totalRamChart', charts.totalRam);
        }

        // 2. RAM by Type Chart

        if (typeRamCtx && stats.countByType) {
            if (charts.typeRam) charts.typeRam.destroy();

            charts.typeRam = new Chart(typeRamCtx, { type: 'doughnut', data: { labels: sortedLabels, datasets: [{ data: sortedData, backgroundColor: ['#60a5fa', '#fb923c', '#9ca3af'], borderColor: isDark ? '#1f2937' : '#fff' }] }, options: doughnutOptions });
            generateLegend('typeRamChart', charts.typeRam);
        }

        // 3. RAM by Jenis Chart

        if (jenisRamCtx && stats.countByJenis) {
            if (charts.jenisRam) charts.jenisRam.destroy();
            const jenisData = stats.countByJenis || {};
            const sortedLabels = ['DDR1', 'DDR2', 'DDR3', 'DDR3L', 'DDR4', 'DDR5', 'N/A'].filter(s => jenisData[s]);

            if (!fieldsConfig) return false;
            const config = fieldsConfig.find(f => f.name.trim().toLowerCase() === fieldName.trim().toLowerCase());
            return config && config.groupName && config.groupName.trim() !== '';
        };

        const isHidden = (fieldName) => {
            if (!fieldsConfig) return false;
            const config = fieldsConfig.find(f => f.name.trim().toLowerCase() === fieldName.trim().toLowerCase());
            return (config && config.hiddenInDashboard) || isGrouped(fieldName);
        };

        const hardcodedRamFields = ['ID', 'Merk', 'SN', 'Type Ram', 'Jenis Ram', 'Size', 'Tgl Pengadaan', 'Layanan', 'Pengguna', 'SN PC', 'Ket.', 'Status', 'RowIndex', 'SheetName', 'Timestamp', 'Diubah Oleh', 'Aksi'];

        const hasTypeJenisSize = !isHidden('Type Ram') || !isHidden('Jenis Ram') || !isHidden('Size');
        const hasLayananPengguna = !isHidden('Layanan') || !isHidden('Pengguna');

            const config = fieldsConfig && fieldsConfig.find(f => f.name.trim().toLowerCase() === k.trim().toLowerCase());
            if (config && config.hiddenInDashboard) return false;
            if (config && config.groupName && config.groupName.trim() !== '') return true;
            if (hardcodedRamFields.includes(k)) return false;
            return true;
        });
        if (fieldsConfig) {
            dynamicRamFields.sort((a, b) => {
                const indexA = fieldsConfig.findIndex(f => f.name.trim().toLowerCase() === a.trim().toLowerCase());
                const indexB = fieldsConfig.findIndex(f => f.name.trim().toLowerCase() === b.trim().toLowerCase());
                if (indexA === -1 && indexB === -1) return 0;
                if (indexA === -1) return 1;
                if (indexB === -1) return -1;
                return indexA - indexB;
            });
        }

        let RamGroupMap = {};

            fieldsConfig.forEach(f => {
                if (f.groupName) {
                    RamGroupMap[f.name] = f.groupName;
                }
            });
        }
        let processedRamGroups = new Set();
        dynamicRamFields.forEach(h => {
            let gName = RamGroupMap[h];
            if (gName) {
                if (!processedRamGroups.has(gName)) {
                    let fieldsInGroup = dynamicRamFields.filter(rh => RamGroupMap[rh] === gName);
                    groupedDynamicRamFields.push({ type: 'group', name: gName, fields: fieldsInGroup });
                    processedRamGroups.add(gName);

                groupedDynamicRamFields.push({ type: 'single', name: h });
            }

                    </div>
        
                </div>
            ` : ''}
              ${hasTypeJenisSize ? `<th scope="col" class="px-6 py-3 align-top h-full align-middle">
                <div class="flex flex-col justify-between h-full min-h-[4rem]">
                    <div>Type / Jenis / Size</div>
                    <div class="relative w-full mt-2">
                        <input type="text" class="form-input text-xs !py-1.5 !pl-1.5 !pr-7 w-full font-normal" data-col-filter="Type / Jenis / Size" placeholder="Cari..." value="${state.columnFilters?.['Type / Jenis / Size'] || ''}">
                        ${state.columnFilters?.['Type / Jenis / Size'] ? `<i class="fas fa-times absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 cursor-pointer hover:text-gray-600" onclick="this.previousElementSibling.value=''; this.previousElementSibling.dispatchEvent(new Event('input', {bubbles:true}))"></i>` : ''}
                    </div>
        
                </div>
            ` : ''}
              ${!isHidden('Tgl Pengadaan') ? `<th scope="col" class="px-6 py-3 align-top h-full align-middle">
                <div class="flex flex-col justify-between h-full min-h-[4rem]">
                    <div>Tgl Pengadaan</div>
                    <div class="relative w-full mt-2">
                        <input type="text" class="form-input text-xs !py-1.5 !pl-1.5 !pr-7 w-full font-normal" data-col-filter="Tgl Pengadaan" placeholder="Cari..." value="${state.columnFilters?.['Tgl Pengadaan'] || ''}">

              ${hasLayananPengguna ? `<th scope="col" class="px-6 py-3 align-top h-full align-middle">

    const generateLaptopDashboardHtml = (data, state, stats, fieldsConfig) => {
        const paginatedData = data.slice((state.currentPage - 1) * state.rowsPerPage, state.rowsPerPage * state.rowsPerPage);
        const totalPages = Math.ceil(data.length / state.rowsPerPage);
                const hardcodedLaptopFields = ['ID', 'Petugas', 'Status', 'Tgl Peminjaman', 'Tgl Pengembalian', 'Aksi', 'RowIndex', 'SheetName', 'Timestamp', 'Diubah Oleh'];
        const allLaptopKeys = (state.originalData && state.originalData.length > 0) ? Object.keys(state.originalData[0]) : (data.length > 0 ? Object.keys(data[0]) : []);
        const dynamicLaptopFields = allLaptopKeys.filter(k => {
            const config = fieldsConfig && fieldsConfig.find(f => f.name.trim().toLowerCase() === k.trim().toLowerCase());
            if (config && config.hiddenInDashboard) return false;
            if (config && config.groupName && config.groupName.trim() !== '') return true;
            if (hardcodedLaptopFields.includes(k)) return false;
            return true;
        });
        if (fieldsConfig) {
            dynamicLaptopFields.sort((a, b) => {
                const indexA = fieldsConfig.findIndex(f => f.name.trim().toLowerCase() === a.trim().toLowerCase());
                const indexB = fieldsConfig.findIndex(f => f.name.trim().toLowerCase() === b.trim().toLowerCase());
                if (indexA === -1 && indexB === -1) return 0;
                if (indexA === -1) return 1;
                if (indexB === -1) return -1;
                return indexA - indexB;
            });
        }

        let groupedDynamicLaptopFields = [];
        let LaptopGroupMap = {};
        if (fieldsConfig) {
            fieldsConfig.forEach(f => {
                if (f.groupName && f.groupName.trim() !== '') {
                    LaptopGroupMap[f.name] = f.groupName;
                }
            });
        }
        let processedLaptopGroups = new Set();
        dynamicLaptopFields.forEach(h => {
            let gName = LaptopGroupMap[h];
            if (gName && gName.trim() !== '') {
                if (!processedLaptopGroups.has(gName)) {
                    let fieldsInGroup = dynamicLaptopFields.filter(rh => LaptopGroupMap[rh] === gName);
                    groupedDynamicLaptopFields.push({ type: 'group', name: gName, fields: fieldsInGroup });
                    processedLaptopGroups.add(gName);
                }
            } else {
                groupedDynamicLaptopFields.push({ type: 'single', name: h });
            }
        });
        
        
                const isGrouped = (fieldName) => {
            if (!fieldsConfig) return false;
            const config = fieldsConfig.find(f => f.name.trim().toLowerCase() === fieldName.trim().toLowerCase());
            return config && config.groupName && config.groupName.trim() !== '';
        };

        const isHidden = (fieldName) => {
            if (!fieldsConfig) return false;
            const config = fieldsConfig.find(f => f.name.trim().toLowerCase() === fieldName.trim().toLowerCase());
            return (config && config.hiddenInDashboard) || isGrouped(fieldName);
        };
        const headers = [];
        if (!isHidden('Petugas')) headers.push('Petugas');
        headers.push(...groupedDynamicLaptopFields);
        if (!isHidden('Status')) headers.push('Status');

                  <div class="legend-color-box" style="background-color: ${colors[index % colors.length]};"></div>

              </div>`).join('');

                itemsHtml += `<div class="mt-1 text-xs text-gray-400 dark:text-gray-500">+${Object.keys(data).length - 4} lainnya</div>`;
            }
            return `<div class="chart-legend">${itemsHtml}</div>`;
        };

          <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-lg">
            <div class="flex flex-col md:flex-row justify-between items-center mb-4 gap-4">
                <div class="flex flex-wrap items-center w-full md:w-auto gap-2">
                    <div class="relative flex-grow w-full md:w-auto">
                        <input type="text" placeholder="Cari..." class="form-input pl-10 pr-10 w-full" value="${state.searchTerm}">
                        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        ${state.searchTerm ? `<button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none" onclick="const i=this.parentElement.querySelector('input'); i.value=''; i.dispatchEvent(new Event('input', {bubbles:true}))"><i class="fas fa-times"></i></button>` : ''}
                    </div>
                    <button id="scan-qr-button" class="btn btn-secondary flex-shrink-0 md:px-3.5"><i class="fas fa-qrcode"></i></button>
                    <button data-action="import-excel" class="btn btn-secondary flex-1 md:flex-initial text-center justify-center text-xs bg-blue-50 text-blue-700 hover:bg-blue-100 dark:bg-blue-900/30 dark:text-blue-300"><i class="fas fa-file-import mr-1.5"></i>Impor</button>
                    <button data-action="export-excel" class="btn btn-secondary flex-1 md:flex-initial text-center justify-center text-xs bg-green-50 text-green-700 hover:bg-green-100 dark:bg-green-900/30 dark:text-green-300"><i class="fas fa-file-excel mr-1.5"></i>Ekspor</button>
                    <button data-action="export-log-aktivitas" class="btn btn-secondary flex-1 md:flex-initial text-center justify-center text-xs bg-indigo-50 text-indigo-700 hover:bg-indigo-100 dark:bg-indigo-900/30 dark:text-indigo-300"><i class="fas fa-download mr-1.5"></i>Log</button>
                </div>
                <div class="flex items-center gap-4">
                    
                    <div class="flex items-center gap-2">
                        <span>Tampilkan</span>
                        <select class="form-select !p-2 !w-auto" data-control="rows-per-page">${[5, 10, 25, 50, 100].map(n => `<option ${state.rowsPerPage == n ? 'selected' : ''}>${n}</option>`).join('')}</select>
                        <span>data</span>
                    </div>
                </div>
            </div>
            <div class="overflow-x-auto overflow-y-auto max-h-[60vh] relative">
                ${generateDynamicTableHtml(paginatedData, fieldsConfig, state)}
                ${data.length === 0 ? '<p class="text-center text-gray-500 dark:text-gray-400 py-8">Tidak ada data yang cocok.</p>' : ''}
            </div>
            <div class="flex justify-between items-center mt-4">
                <span class="text-sm text-gray-700 dark:text-gray-300">Menampilkan ${paginatedData.length > 0 ? (state.currentPage - 1) * state.rowsPerPage + 1 : 0} sampai ${Math.min(state.currentPage * state.rowsPerPage, data.length)} dari ${data.length} data</span>
                <div class="inline-flex mt-2 xs:mt-0">
                    <button class="btn btn-secondary rounded-r-none" data-control="prev" ${state.currentPage <= 1 ? 'disabled' : ''}>Prev</button>
                    <button class="btn btn-secondary rounded-l-none" data-control="next" ${state.currentPage >= totalPages ? 'disabled' : ''}>Next</button>
                </div>
            </div>
          </div>`;
    };
</script>
