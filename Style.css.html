<style>
  /* Custom Styles */
  body {
    font-family: 'Inter', sans-serif;
  }

  .nav-link {
    padding: 8px 16px;
    border-radius: 8px;
    transition: background-color 0.3s, color 0.3s;
    border: 2px solid transparent;
  }

  .nav-link.active {
    background-color: #4f46e5;
    color: white;
    font-weight: 600;
  }

  .nav-link:not(.active):hover {
    background-color: #e0e7ff;
    color: #312e81;
  }

  .dark .nav-link:not(.active):hover {
    background-color: #3730a3;
    color: #e0e7ff;
  }

  .content-section {
    display: none;
  }

  .content-section.active {
    display: block;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 1rem;
  }

  .form-input,
  .form-select {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid #d1d5db;
    border-radius: 0.5rem;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .form-input:focus,
  .form-select:focus {
    outline: none;
    border-color: #4f46e5;
    box-shadow: 0 0 0 2px #c7d2fe;
  }

  .dark .form-input,
  .dark .form-select {
    background-color: #374151;
    border-color: #4b5563;
    color: white;
  }

  .dark .form-input:focus,
  .dark .form-select:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 2px #4f46e5;
  }

  .btn {
    padding: 0.75rem 1.5rem;
    border-radius: 0.5rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn:disabled {
    cursor: not-allowed;
    opacity: 0.5;
  }

  .btn-primary {
    background-color: #4f46e5;
    color: white;
  }

  .btn-primary:hover {
    background-color: #4338ca;
  }

  .btn-secondary {
    background-color: #e5e7eb;
    color: #374151;
  }

  .btn-secondary:hover {
    background-color: #d1d5db;
  }

  .dark .btn-secondary {
    background-color: #4b5563;
    color: #e5e7eb;
  }

  .dark .btn-secondary:hover {
    background-color: #6b7280;
  }

  #toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 1rem 1.5rem;
    border-radius: 0.5rem;
    color: white;
    font-weight: 500;
    z-index: 1050;
    transform: translateY(200%);
    transition: transform 0.5s ease-in-out;
  }

  #toast.show {
    transform: translateY(0);
  }

  #toast.success {
    background-color: #10b981;
  }

  #toast.error {
    background-color: #ef4444;
  }

  /* Modal Styles */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1040;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s, visibility 0.3s;
  }

  .modal-overlay.active {
    opacity: 1;
    visibility: visible;
  }

  .modal-content {
    background: white;
    padding: 2rem;
    border-radius: 0.5rem;
    max-width: 90%;
    width: 600px;
    max-height: 90vh;
    overflow-y: auto;
    transform: scale(0.95);
    transition: transform 0.3s;
  }

  .dark .modal-content {
    background: #1f2937;
  }

  .modal-overlay.active .modal-content {
    transform: scale(1);
  }

  .chart-container {
    position: relative;
    min-height: 80px;
    width: 100%;
  }

  /* QR Code Scanner Style */
  #qr-reader {
    border: 2px solid #e5e7eb;
    border-radius: 0.5rem;
    overflow: hidden;
  }

  .dark #qr-reader {
    border-color: #4b5563;
  }

  .dashboard-chart-card {
    background-color: white;
    padding: 1rem;
    border-radius: 0.5rem;
    box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .dark .dashboard-chart-card {
    background-color: #1f2937;
    box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.2), 0 1px 2px 0 rgba(0, 0, 0, 0.1);
  }

  .doughnut-chart-container {
    position: relative;
    width: 100px;
    height: 100px;
    flex-shrink: 0;
  }

  .doughnut-chart-container .chart-center-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
  }

  .doughnut-chart-container .chart-center-text .value {
    font-size: 1.5rem;
    font-weight: 700;
    color: #1f2937;
  }

  .dark .doughnut-chart-container .chart-center-text .value {
    color: #f3f4f6;
  }

  .doughnut-chart-container .chart-center-text .label {
    font-size: 0.75rem;
    color: #6b7280;
  }

  .dark .doughnut-chart-container .chart-center-text .label {
    color: #9ca3af;
  }

  .chart-legend {
    font-size: 0.875rem;
    color: #4b5563;
  }

  .dark .chart-legend {
    color: #d1d5db;
  }

  .chart-legend .legend-item {
    display: flex;
    align-items: center;
    margin-bottom: 0.25rem;
  }

  .chart-legend .legend-color-box {
    width: 12px;
    height: 12px;
    margin-right: 8px;
    border-radius: 2px;
  }

  .nav-link.active-nav {
    color: #2563eb !important;
    font-weight: 700 !important;
    background-color: #eff6ff !important;
    border-radius: 0.375rem;
  }
  .dark .nav-link.active-nav {
    color: #93c5fd !important;
    background-color: #1e3a8a !important;
  }
  /* Remove hover override on active */
  .nav-link.active-nav:hover {
    background-color: #eff6ff !important;
  }
  .dark .nav-link.active-nav:hover {
    background-color: #1e3a8a !important;
  }


  /* ============================================================
     STYLING DINAMIS BERBASIS CUSTOM BACKGROUND GAMBAR (.has-custom-bg)
     Ketika background gambar aktif -> Tampilan otomatis Kaca Transparan (Glassmorphism).
     Ketika background default (kosong) -> Tampilan otomatis KEMBALI NORMAL ke desain bawaan.
     ============================================================ */

  /* Header & Footer Transparan saat ada Custom Background */
  body.has-custom-bg #main-header {
    background: linear-gradient(180deg, rgba(0, 0, 0, 0.45) 0%, rgba(0, 0, 0, 0.12) 100%) !important;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.18) !important;
  }

  body.has-custom-bg #main-footer {
    background: linear-gradient(0deg, rgba(0, 0, 0, 0.5) 0%, rgba(0, 0, 0, 0.1) 100%) !important;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border-top: 1px solid rgba(255, 255, 255, 0.18) !important;
  }

  /* Logo Branding Text Shadow saat ada Custom Background */
  body.has-custom-bg #main-header nav .font-bold.text-xl {
    text-shadow: 0 2px 5px rgba(0, 0, 0, 0.85);
  }

  /* Navigasi Header: Teks Putih Berbayang saat ada Custom Background */
  body.has-custom-bg #main-header .nav-link {
    color: #ffffff !important;
    font-weight: 500;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 2px 6px rgba(0, 0, 0, 0.7) !important;
    border-radius: 0.5rem;
    transition: all 0.2s ease-in-out;
  }

  body.has-custom-bg #main-header .nav-link:hover {
    background-color: rgba(255, 255, 255, 0.22) !important;
    color: #ffffff !important;
    backdrop-filter: blur(8px);
  }

  body.has-custom-bg #main-header .nav-link.active,
  body.has-custom-bg #main-header .nav-link.active-nav {
    background-color: var(--primary-color, #4f46e5) !important;
    color: #ffffff !important;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
    text-shadow: none !important;
  }

  /* Dropdown Button arrow & text saat ada Custom Background */
  body.has-custom-bg #manage-dropdown-trigger svg,
  body.has-custom-bg #dashboard-dropdown-trigger svg {
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.8));
  }

  /* Dropdown Menu Popup saat ada Custom Background */
  body.has-custom-bg #manage-dropdown-menu,
  body.has-custom-bg #dashboard-dropdown-menu,
  body.has-custom-bg #user-profile-menu,
  body.has-custom-bg #mobile-menu {
    background-color: rgba(15, 23, 42, 0.95) !important;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.2) !important;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6) !important;
  }

  body.has-custom-bg #manage-dropdown-menu a,
  body.has-custom-bg #dashboard-dropdown-menu a,
  body.has-custom-bg #user-profile-menu a,
  body.has-custom-bg #mobile-menu a {
    color: #f1f5f9 !important;
    text-shadow: none !important;
  }

  body.has-custom-bg #manage-dropdown-menu a:hover,
  body.has-custom-bg #dashboard-dropdown-menu a:hover,
  body.has-custom-bg #user-profile-menu a:hover,
  body.has-custom-bg #mobile-menu a:hover {
    background-color: rgba(255, 255, 255, 0.15) !important;
    color: #ffffff !important;
  }

  body.has-custom-bg #main-header #user-name {
    color: #ffffff !important;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9) !important;
  }

  body.has-custom-bg #main-header #theme-toggle {
    color: #ffffff !important;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.8));
  }

  body.has-custom-bg #main-header #theme-toggle:hover {
    background-color: rgba(255, 255, 255, 0.2) !important;
    color: #ffffff !important;
  }

  body.has-custom-bg #main-footer div {
    color: #ffffff !important;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9) !important;
    font-weight: 500;
  }

  /* Banner Selamat Datang di Home saat ada Custom Background */
  body.has-custom-bg .home-welcome-card {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(0, 0, 0, 0.28) 100%) !important;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 255, 255, 0.18) !important;
    border-radius: 1.25rem;
    padding: 1.75rem 2rem;
    margin-bottom: 2.5rem;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35) !important;
  }

  body.has-custom-bg .home-welcome-card h1 {
    color: #ffffff !important;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9) !important;
  }

  body.has-custom-bg .home-welcome-card p {
    color: #e2e8f0 !important;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85) !important;
  }

  /* 6 Kartu Dasbor di Home saat ada Custom Background */
  body.has-custom-bg .dashboard-card-link {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(0, 0, 0, 0.3) 100%) !important;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.18) !important;
    border-radius: 1rem;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3) !important;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1) !important;
  }

  body.has-custom-bg .dashboard-card-link:hover {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.22) 0%, rgba(0, 0, 0, 0.2) 100%) !important;
    border-color: rgba(255, 255, 255, 0.4) !important;
    transform: translateY(-4px);
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45) !important;
  }

  body.has-custom-bg .dashboard-card-link h3 {
    color: #ffffff !important;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9) !important;
  }

  body.has-custom-bg .dashboard-card-link p {
    color: #cbd5e1 !important;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85) !important;
  }

  body.has-custom-bg .dashboard-card-link i {
    filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
  }

  /* Judul Section di luar Card saat ada Custom Background */
  body.has-custom-bg .content-section > h2 {
    color: #ffffff !important;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8), 0 1px 3px rgba(0, 0, 0, 0.9);
    display: inline-block;
    padding: 6px 18px;
    background: rgba(15, 23, 42, 0.65);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    margin-bottom: 1.5rem;
  }

  body.has-custom-bg .detail-footer-text {
    color: #ffffff !important;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9) !important;
  }

  /* ============================================================
     SEMUA CARD (DASBOR UTAMA, INPUT, MANAGE, DASHBOARD ASET)
     MENJADI TRANSPARAN KETIKA MEMAKAI BACKGROUND GAMBAR
     ============================================================ */

  /* Wadah Card Utama (bg-white & dark:bg-gray-800 di dalam content-section) */
  body.has-custom-bg .content-section .bg-white,
  body.has-custom-bg .content-section .dark\:bg-gray-800,
  body.has-custom-bg #asset-content {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(15, 23, 42, 0.45) 100%) !important;
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
    border: 1px solid rgba(255, 255, 255, 0.18) !important;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35) !important;
  }

  /* Judul & Teks di dalam Card */
  body.has-custom-bg .content-section h2,
  body.has-custom-bg .content-section h3,
  body.has-custom-bg .content-section h4 {
    color: #ffffff !important;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
  }

  body.has-custom-bg .content-section label {
    color: #f1f5f9 !important;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
  }

  body.has-custom-bg .content-section p:not(.text-red-500) {
    color: #cbd5e1 !important;
  }

  /* Angka Statistik Besar di Stat Cards */
  body.has-custom-bg .content-section [id$="-stat"],
  body.has-custom-bg .content-section .text-3xl.font-bold {
    color: #ffffff !important;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
  }

  /* Lingkaran Ikon Stat Cards */
  body.has-custom-bg .content-section .rounded-full.bg-blue-100,
  body.has-custom-bg .content-section .rounded-full.bg-green-100,
  body.has-custom-bg .content-section .rounded-full.bg-yellow-100,
  body.has-custom-bg .content-section .rounded-full.bg-purple-100,
  body.has-custom-bg .content-section .rounded-full.bg-red-100,
  body.has-custom-bg .content-section [class*="dark:bg-blue-900"],
  body.has-custom-bg .content-section [class*="dark:bg-green-900"],
  body.has-custom-bg .content-section [class*="dark:bg-yellow-900"],
  body.has-custom-bg .content-section [class*="dark:bg-purple-900"] {

    border: 1px solid rgba(255, 255, 255, 0.2);
  }

  /* Form Inputs, Selects, & Textarea di dalam Card Transparan & Modal Popup */
  body.has-custom-bg .content-section .form-input,
  body.has-custom-bg .content-section .form-select,
  body.has-custom-bg .content-section input[type="text"],
  body.has-custom-bg .content-section input[type="date"],
  body.has-custom-bg .content-section input[type="number"],
  body.has-custom-bg .content-section select,
  body.has-custom-bg .content-section textarea,
  body.has-custom-bg .modal-content .form-input,
  body.has-custom-bg .modal-content .form-select,
  body.has-custom-bg .modal-content input,
  body.has-custom-bg .modal-content select,
  body.has-custom-bg .modal-content textarea {

    border: 1px solid rgba(255, 255, 255, 0.28) !important;
    color: #ffffff !important;
    backdrop-filter: blur(8px);
  }

  body.has-custom-bg .content-section .form-input::placeholder,
  body.has-custom-bg .content-section input::placeholder,
  body.has-custom-bg .modal-content .form-input::placeholder,
  body.has-custom-bg .modal-content input::placeholder {

  }

  body.has-custom-bg .content-section .form-input:focus,
  body.has-custom-bg .content-section .form-select:focus,
  body.has-custom-bg .modal-content .form-input:focus,
  body.has-custom-bg .modal-content .form-select:focus,
  body.has-custom-bg .modal-content input:focus,
  body.has-custom-bg .modal-content select:focus,
  body.has-custom-bg .modal-content textarea:focus {

    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.4) !important;

  }

  body.has-custom-bg .content-section table thead,
  body.has-custom-bg .content-section table thead tr,
  body.has-custom-bg .content-section table thead th {

  }

  body.has-custom-bg .content-section table tbody tr {

  body.has-custom-bg .content-section table tbody tr:hover {

  }

  body.has-custom-bg .content-section table tbody td {
    color: #e2e8f0 !important;
    border-color: rgba(255, 255, 255, 0.1) !important;
  }

  /* Baris Card Responsive pada Mobile */
  body.has-custom-bg .content-section tr.block.md\:table-row {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(15, 23, 42, 0.35) 100%) !important;
    border: 1px solid rgba(255, 255, 255, 0.15) !important;
    border-radius: 0.75rem;
    margin-bottom: 0.75rem;
  }

  /* Modal Popup ketika ada Background */

  /* ============================================================
     KONTRAST TINGGI (TEKS, SUB-TEKS, ICON, BUTTON, BADGE, & GRAFIK)

     ============================================================ */

  body.has-custom-bg .content-section [id$="-stat"] span,
  body.has-custom-bg .content-section .text-xs.text-gray-600,
